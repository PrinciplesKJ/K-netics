name: Validate entries

on:
  pull_request:
    paths:
      - 'data/entries/**.json'
      - 'schema/entry_schema.json'
      - 'scripts/validate.py'
  push:
    branches: [main]
    paths:
      - 'data/entries/**.json'
      - 'schema/entry_schema.json'
      - 'scripts/validate.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate all entries
        run: python scripts/validate.py
