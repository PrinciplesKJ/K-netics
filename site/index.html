<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-netics · DSD kinetics database</title>
  <meta name="description" content="An open, curated database of experimentally measured DNA strand displacement reaction kinetics." />

  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/layout.css" />
</head>
<body>

  <div class="app">

    <!-- ░░ topbar ░░ -->
    <header class="topbar">
      <span class="topbar-brand">
        <span class="topbar-brand-mark"></span>
        K-netics
      </span>
      <span style="color: var(--color-text-faint); font-size: var(--text-sm);">DSD kinetics</span>

      <div class="topbar-stats">
        <span><strong id="stat-entries">—</strong> entries</span>
        <span><strong id="stat-papers">—</strong> papers</span>
        <span>updated <strong id="stat-updated">—</strong></span>
      </div>

      <span class="topbar-spacer"></span>

      <a class="icon-btn" href="https://github.com/PrinciplesKJ/K-netics" target="_blank" rel="noopener" title="View on GitHub" aria-label="GitHub">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
      <button class="icon-btn" id="help-btn" title="Keyboard shortcuts (?)" aria-label="Help">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.5"/><path d="M6 6c.3-1 1-1.5 2-1.5s2 .6 2 1.7c0 .8-.5 1.2-1 1.5-.6.3-1 .6-1 1.3M8 11.5v.05"/></svg>
      </button>
    </header>

    <!-- ░░ command bar ░░ -->
    <div class="command-bar">
      <div class="search">
        <span class="search-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        </span>
        <input class="search-input" id="search" type="search" placeholder="Search sequences, DOI, author, method…" autocomplete="off" />
        <span class="search-shortcut"><kbd>/</kbd></span>
      </div>

      <div style="position: relative;">
        <button class="btn" id="add-filter">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
          Filter
        </button>
        <div class="popover" id="filter-popover" hidden></div>
      </div>

      <div class="chips" id="chips"></div>

      <span style="flex: 1;"></span>

      <button class="btn" id="export-btn" title="Download visible entries as CSV">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-5-5l5 5 5-5M5 21h14"/></svg>
        Export
      </button>
    </div>

    <!-- ░░ result info strip ░░ -->
    <div class="result-info" id="result-info">Loading…</div>

    <!-- ░░ data table ░░ -->
    <main class="app-main">
      <div class="entries" id="entries"></div>
    </main>

  </div>

  <!-- ░░ shortcuts modal ░░ -->
  <div class="help-modal" id="help-modal">
    <div class="help-modal-content">
      <h2>Keyboard shortcuts</h2>
      <dl>
        <dt><kbd>/</kbd></dt><dd>Focus search</dd>
        <dt><kbd>j</kbd> / <kbd>↓</kbd></dt><dd>Next entry</dd>
        <dt><kbd>k</kbd> / <kbd>↑</kbd></dt><dd>Previous entry</dd>
        <dt><kbd>Enter</kbd></dt><dd>Expand / collapse selected entry</dd>
        <dt><kbd>Esc</kbd></dt><dd>Close · clear search · collapse</dd>
        <dt><kbd>?</kbd></dt><dd>Show this help</dd>
      </dl>
      <p style="margin-top: var(--space-4); font-size: var(--text-xs); color: var(--color-text-muted);">
        Press <kbd>Esc</kbd> or click outside to close.
      </p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
